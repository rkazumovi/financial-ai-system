apiVersion: apps/v1
kind: Deployment
metadata:
  name: financial-ai-api
  labels:
    app: financial-ai-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: financial-ai-api
  template:
    metadata:
      labels:
        app: financial-ai-api
    spec:
      containers:
        - name: financial-ai-api
          image: financial-ai-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"